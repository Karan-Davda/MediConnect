# Nginx Configuration for MediConnect QA Environment
# Place this file at: /etc/nginx/sites-available/mediconnect-qa
# Then create symlink: sudo ln -s /etc/nginx/sites-available/mediconnect-qa /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 80;
    server_name 3.144.150.239;

    # Root directory for frontend static files
    # Frontend is deployed to /var/www/mediconnect-qa (dist contents directly here)
    root /var/www/mediconnect-qa;
    index index.html;

    # Proxy API requests to backend (running on port 3001)
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache control
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Allow all HTTP methods (GET, POST, PUT, DELETE, etc.)
        # This is important for API endpoints
    }

    # Serve frontend static files
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check endpoint (optional)
    location /health {
        proxy_pass http://localhost:3001/health;
        proxy_set_header Host $host;
    }

    # Logging
    access_log /var/log/nginx/mediconnect-qa-access.log;
    error_log /var/log/nginx/mediconnect-qa-error.log;
}

